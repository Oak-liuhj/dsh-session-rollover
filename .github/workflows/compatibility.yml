name: DSH upgrade compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-${{ matrix.os }}-node${{ matrix.node }}
          path: out/
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: targets
        run: |
          matrix=$(node scripts/check-dsh-compatibility.mjs --list)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  public-contracts:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-dsh-compatibility.mjs '${{ matrix.version }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-contracts-${{ matrix.version }}
          path: out/dsh-compatibility.json
